<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拍研所 · 乒乓球拍 3D 配置器</title>
<meta name="description" content="Three.js 驱动的乒乓球拍 3D 配置器：43 款主流底板、82 款市售胶皮自由组合，实时预览并给出性能评估。">
<link rel="stylesheet" href="./css/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- ============ 图标库（内联 SVG symbol，全站零 emoji） ============ -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
  </symbol>
  <symbol id="i-paddle" viewBox="0 0 24 24">
    <path d="M13.6 2.6a8.5 8.5 0 0 1 0 12 8.5 8.5 0 0 1-12 0 8.5 8.5 0 0 1 0-12 8.5 8.5 0 0 1 12 0z"/>
    <path d="M9.4 14.6L4.2 19.8a1.7 1.7 0 0 0 2.4 2.4l5.2-5.2"/>
  </symbol>
  <symbol id="i-layers" viewBox="0 0 24 24">
    <path d="M12 2.6l9.4 5-9.4 5-9.4-5 9.4-5z"/><path d="M2.6 16.4l9.4 5 9.4-5"/><path d="M2.6 12l9.4 5 9.4-5"/>
  </symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24">
    <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/>
    <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/>
  </symbol>
  <symbol id="i-camera" viewBox="0 0 24 24">
    <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.9l1.2-2h6.8l1.2 2h1.9A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
    <circle cx="12" cy="13" r="3.6"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6.5L9.6 17 4.2 11.6"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.2"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24">
    <path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    <path d="M12 9.5v4.2"/><path d="M12 17.4h.01"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24">
    <path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1-.6-1.4V4.4A1.8 1.8 0 0 1 4.6 2.6H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8z"/>
    <path d="M7.6 7.6h.01"/>
  </symbol>
  <symbol id="i-scale" viewBox="0 0 24 24">
    <path d="M12 3.2v17.6"/><path d="M5 7.6h14"/>
    <path d="M2.4 14.4L5 7.6l2.6 6.8a2.9 2.9 0 0 1-5.2 0z"/>
    <path d="M16.4 14.4L19 7.6l2.6 6.8a2.9 2.9 0 0 1-5.2 0z"/>
  </symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24">
    <path d="M15.6 2.6l5.8 5.8a1.4 1.4 0 0 1 0 2l-10.9 11a1.4 1.4 0 0 1-2 0L2.6 15.6a1.4 1.4 0 0 1 0-2l11-11a1.4 1.4 0 0 1 2 0z"/>
    <path d="M6.6 11.4l2.4 2.4"/><path d="M9.8 8.2l2.4 2.4"/><path d="M13 5l2.4 2.4"/>
  </symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13.4 2.2L4 13.6h7.2L10.6 21.8 20 10.4h-7.2z"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24">
    <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.4V9h-5.6"/>
    <circle cx="12" cy="12" r="2.2"/>
  </symbol>
  <symbol id="i-target" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="12" r="5.2"/><circle cx="12" cy="12" r="1.4"/>
  </symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24">
    <path d="M3.4 18.4a9.6 9.6 0 1 1 17.2 0"/><path d="M12 18.4l4.2-6"/>
  </symbol>
  <symbol id="i-box" viewBox="0 0 24 24">
    <path d="M21 7.8v8.4a1.8 1.8 0 0 1-.9 1.6l-7.2 3.9a1.8 1.8 0 0 1-1.8 0l-7.2-3.9A1.8 1.8 0 0 1 3 16.2V7.8a1.8 1.8 0 0 1 .9-1.6l7.2-3.9a1.8 1.8 0 0 1 1.8 0l7.2 3.9A1.8 1.8 0 0 1 21 7.8z"/>
    <path d="M3.3 7L12 11.7 20.7 7"/><path d="M12 21.2V11.7"/>
  </symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24">
    <path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/>
    <path d="M1.8 14h4.4"/><path d="M9.8 12h4.4"/><path d="M17.8 16h4.4"/>
  </symbol>
  <symbol id="i-eye" viewBox="0 0 24 24">
    <path d="M2 12s3.6-6.6 10-6.6S22 12 22 12s-3.6 6.6-10 6.6S2 12 2 12z"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M12 3v12"/><path d="M7.4 10.6L12 15.2l4.6-4.6"/><path d="M3.8 20.4h16.4"/>
  </symbol>
  <symbol id="i-star" viewBox="0 0 24 24">
    <path d="M12 3l1.9 5.8a2 2 0 0 0 1.9 1.4h6.1l-4.9 3.6a2 2 0 0 0-.7 2.2l1.9 5.8-4.9-3.6a2 2 0 0 0-2.4 0l-4.9 3.6 1.9-5.8a2 2 0 0 0-.7-2.2L3.1 10.2h6.1a2 2 0 0 0 1.9-1.4z"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 2.6l8 3.2v6c0 4.8-3.3 8.8-8 10.6-4.7-1.8-8-5.8-8-10.6v-6z"/>
  </symbol>
  <symbol id="i-flip" viewBox="0 0 24 24">
    <path d="M12 3v18"/><path d="M8.5 6.5L4 12l4.5 5.5"/><path d="M15.5 6.5L20 12l-4.5 5.5"/>
  </symbol>
  <!-- 视角：宽面 / 窄棱 -->
  <symbol id="i-view-front" viewBox="0 0 24 24">
    <rect x="3.4" y="4.2" width="17.2" height="15.6" rx="3.4"/><circle cx="12" cy="12" r="3.2"/>
  </symbol>
  <symbol id="i-view-edge" viewBox="0 0 24 24">
    <rect x="8.4" y="3.4" width="7.2" height="17.2" rx="3.4"/><path d="M12 3.4v17.2"/>
  </symbol>
  <!-- 拍面：右半实心 = 一面，左半实心 = 另一面 -->
  <symbol id="i-face-a" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.6"/>
    <path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-face-b" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.6"/>
    <path d="M12 3.4a8.6 8.6 0 0 0 0 17.2z" fill="currentColor" stroke="none"/>
  </symbol>
</svg>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-paddle"/></svg>
    </span>
    <span class="brand__text">
      <b>拍研所</b>
      <i>BLADE &amp; RUBBER LAB</i>
    </span>
  </div>

  <div class="presets" id="presets" role="group" aria-label="职业选手配置预设"></div>

  <div class="topbar__actions">
    <button class="btn btn--ghost" id="btnAutoRotate" aria-pressed="true">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-rotate"/></svg>
      自动旋转
    </button>
    <button class="btn btn--ghost" id="btnShot">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-camera"/></svg>
      截图
    </button>
    <button class="btn btn--ghost" id="btnReset">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-refresh"/></svg>
      重置
    </button>
  </div>
</header>

<main class="workspace">

  <!-- ============ 左：底板 ============ -->
  <aside class="panel" aria-label="底板选择">
    <div class="panel__head">
      <h2 class="panel__title">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-layers"/></svg>
        底板
      </h2>
      <span class="panel__count" id="bladeCount"></span>
    </div>

    <div class="field">
      <svg class="ic field__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="search" id="bladeSearch" placeholder="搜索型号，如 Viscaria / 龙 5" autocomplete="off">
    </div>

    <div class="chips" id="bladeBrands" role="group" aria-label="底板品牌筛选"></div>
    <div class="panel__list" id="bladeList" role="listbox" aria-label="底板列表"></div>
  </aside>

  <!-- ============ 中：3D 舞台 ============ -->
  <section class="stage">
    <canvas id="view"></canvas>

    <div class="stage__tag">
      <div class="stage__name" id="stageName">—</div>
      <div class="stage__meta" id="stageMeta"></div>
    </div>

    <div class="stage__views" role="group" aria-label="视角切换">
      <button class="vbtn is-on" data-view="front">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-view-front"/></svg>
        正面
      </button>
      <button class="vbtn" data-view="side">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-view-edge"/></svg>
        侧视
      </button>
      <button class="vbtn" data-view="layer">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-layers"/></svg>
        层剖
      </button>
      <button class="vbtn" data-view="back">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-flip"/></svg>
        背面
      </button>
      <button class="vbtn" data-view="iso">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-box"/></svg>
        立体
      </button>
    </div>

    <div class="stage__hint">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-eye"/></svg>
      拖拽旋转 · 滚轮缩放
    </div>

    <div class="stage__loading" id="stageLoading">
      <span class="spinner" aria-hidden="true"></span>
      正在装载 3D 引擎…
    </div>

    <div class="stage__err" id="stageErr" hidden></div>
  </section>

  <!-- ============ 右：胶皮 ============ -->
  <aside class="panel" aria-label="胶皮选择">
    <div class="panel__head">
      <h2 class="panel__title">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-spin"/></svg>
        胶皮
      </h2>
      <span class="panel__count" id="rubberCount"></span>
    </div>

    <div class="seg" id="sideTabs" role="tablist" aria-label="选择面">
      <button class="seg__btn is-on" data-side="fh" role="tab" aria-selected="true">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-face-a"/></svg>
        正手
      </button>
      <button class="seg__btn" data-side="bh" role="tab" aria-selected="false">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-face-b"/></svg>
        反手
      </button>
    </div>

    <div class="ctrl">
      <div class="ctrl__row">
        <span class="ctrl__label">颜色</span>
        <div class="swatches" id="colorRow" role="group" aria-label="胶皮颜色"></div>
      </div>
      <div class="ctrl__row">
        <span class="ctrl__label">厚度</span>
        <div class="chips chips--sm" id="thicknessRow" role="group" aria-label="海绵厚度"></div>
      </div>
    </div>

    <div class="field">
      <svg class="ic field__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="search" id="rubberSearch" placeholder="搜索胶皮，如 Dignics / 狂飙" autocomplete="off">
    </div>

    <div class="chips" id="rubberTypes" role="group" aria-label="胶皮类型筛选"></div>
    <div class="chips" id="rubberBrands" role="group" aria-label="胶皮品牌筛选"></div>
    <div class="panel__list" id="rubberList" role="listbox" aria-label="胶皮列表"></div>

    <div class="ctrl ctrl--bottom">
      <div class="ctrl__row">
        <span class="ctrl__label">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-sliders"/></svg>
          柄型
        </span>
        <div class="chips chips--sm" id="handleRow" role="group" aria-label="拍柄形状"></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="edgeTape">
        <span class="switch__box" aria-hidden="true"></span>
        护边
      </label>
    </div>
  </aside>
</main>

<!-- ============ 底：性能仪表盘 ============ -->
<footer class="hud">
  <div class="hud__main">
    <div class="hud__head">
      <h2 class="hud__title">性能评估</h2>
      <div class="legend" id="legend">
        <span class="legend__item"><i class="legend__dot legend__dot--blade"></i>底板贡献</span>
        <span class="legend__item"><i class="legend__dot legend__dot--rubber"></i>胶皮贡献</span>
      </div>
    </div>
    <div class="meters" id="meters"></div>
  </div>

  <div class="hud__side">
    <div class="kpis" id="kpis"></div>
    <div class="advice" id="advice"></div>
    <div class="warns" id="warns"></div>
  </div>
</footer>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
  import { boot } from './js/app.js';
  boot().catch(err => {
    console.error(err);
    const box = document.getElementById('stageErr');
    const load = document.getElementById('stageLoading');
    if (load) load.hidden = true;
    if (box) {
      box.hidden = false;
      box.textContent = '初始化失败：' + (err && err.message ? err.message : String(err));
    }
  });
</script>
</body>
</html>
